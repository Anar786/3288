<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
/* Обложка видео 9:16. Шрифт ProximaNova подгружается с 100med.ru (в репозиторий не копируется). */
@font-face{font-family:PN;font-weight:400;src:url(https://100med.ru/local/templates/100med/builds/prod/font/ProximaNova-Regular.woff2) format("woff2")}
@font-face{font-family:PN;font-weight:600;src:url(https://100med.ru/local/templates/100med/builds/prod/font/ProximaNova-Semibold.woff2) format("woff2")}
@font-face{font-family:PN;font-weight:700;src:url(https://100med.ru/local/templates/100med/builds/prod/font/ProximaNova-Bold.woff2) format("woff2")}
:root{--navy:#1B1455;--blue:#6187FF;--blue-d:#354092;--pink:#E90055;--bg:#EDF0F5}
*{box-sizing:border-box;margin:0}
body{font-family:PN,Arial,sans-serif;background:#999}
#cover{width:1080px;height:1920px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--blue) 0%,var(--blue-d) 100%);color:#fff}
.logo{position:absolute;top:96px;left:80px;background:#fff;border-radius:60px;padding:22px 40px}
.logo img{height:64px;display:block}
.wm{position:absolute;font-weight:700;font-size:900px;line-height:1;color:rgba(255,255,255,.07);left:-60px;top:330px;letter-spacing:-40px}
.badge{position:absolute;top:470px;left:80px;background:#fff;color:var(--pink);font-weight:600;font-size:44px;padding:18px 40px;border-radius:60px}
h1{position:absolute;top:580px;left:80px;right:80px;font-weight:600;font-size:132px;line-height:1.0;letter-spacing:-2px}
h1 span{display:inline-block;margin-top:24px;color:#fff;background:var(--pink);border-radius:32px;padding:4px 28px 14px;line-height:1}
.sub{position:absolute;top:1090px;left:80px;right:300px;font-size:46px;line-height:1.3;opacity:.95}
/* иллюстрация: капсула */
.capsule{position:absolute;right:-40px;top:1080px;width:520px;height:220px;border-radius:110px;transform:rotate(-35deg);display:flex;overflow:hidden;box-shadow:0 40px 80px rgba(27,20,85,.35)}
.capsule div{flex:1}.capsule .a{background:#fff}.capsule .b{background:var(--pink)}
.capsule:after{content:"";position:absolute;left:40px;top:34px;width:180px;height:36px;border-radius:20px;background:rgba(255,255,255,.55)}
.q{position:absolute;right:300px;top:1200px;width:170px;height:170px;border-radius:50%;background:#fff;color:var(--blue);font-weight:700;font-size:120px;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 60px rgba(27,20,85,.3)}
.doc{position:absolute;left:80px;top:1460px;display:flex;align-items:center;gap:24px;background:rgba(255,255,255,.15);border-radius:60px;padding:18px 36px 18px 18px}
.doc i{width:72px;height:72px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.doc b{font-weight:600;font-size:40px;display:block}.doc small{font-size:32px;opacity:.85}
</style></head><body>
<div id="cover">
<div class="wm">100</div>
<div class="logo"><img src="logo.svg"></div>
<div class="badge">Врач отвечает</div>
<h1>Антибиотик при простуде: <span>поможет?</span></h1>
<div class="sub">Терапевт объясняет, когда он нужен, а когда нет</div>
<div class="capsule"><div class="a"></div><div class="b"></div></div>
<div class="q">?</div>
<div class="doc"><i><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6187FF" stroke-width="2.2" stroke-linecap="round"><path d="M6 3v6a6 6 0 0 0 12 0V3M12 15v2a4 4 0 0 0 8 0v-3"/><circle cx="20" cy="12" r="2"/></svg></i><div><b>[ФИО врача]</b><small>терапевт 100med</small></div></div>
</div></body></html>
